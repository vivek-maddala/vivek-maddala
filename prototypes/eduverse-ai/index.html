<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EduVerse AI — Prototype</title><style>body{font-family:Inter,system-ui;background:#081329;color:#eaf1ff;margin:0;padding:30px}main{max-width:850px;margin:auto}.card{background:#132342;border:1px solid #294264;border-radius:18px;padding:22px;margin:16px 0}button{background:#67a4ff;color:#071326;border:0;padding:12px 18px;border-radius:10px;font-weight:bold;cursor:pointer}input,textarea{padding:12px;border-radius:9px;border:1px solid #456;background:#081329;color:white;width:90%}.muted{color:#9bb2d5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}</style></head><body><main><p class="muted">FORGEPATH · PROTOTYPE</p><h1>EduVerse AI</h1><p>AI Student Operating System</p><div class="grid"><div class="card"><h3>Learning focus</h3><p>Choose a topic and begin a quick self-check.</p><input id="topic" placeholder="e.g. Linear equations"><button onclick="quiz()">Start self-check</button><p id="result"></p></div><div class="card"><h3>Study planner</h3><textarea id="plan" placeholder="Write today's study tasks..."></textarea><button onclick="save()">Save locally</button><p id="saved"></p></div><div class="card"><h3>Prototype notice</h3><p class="muted">This is a local UI prototype. AI, accounts, textbook grounding and cloud storage are not connected.</p></div></div><script>function quiz(){let t=document.getElementById('topic').value||'your topic';document.getElementById('result').innerText='Self-check setup for '+t+' — question engine not connected yet.'}function save(){document.getElementById('saved').innerText='Task list saved for this page session (prototype).';}</script></main></body></html>
